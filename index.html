
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perdóname, miamorrrr 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background: linear-gradient(135deg, #ffe1ec, #ffc4df, #fff0f6);
      font-family: "Trebuchet MS", sans-serif;
      color: #c33370;
    }

    .card {
      width: min(92%, 520px);
      padding: 32px 22px;
      margin: 25px 0;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 3px solid white;
      border-radius: 30px;
      box-shadow: 0 12px 35px #e879a655;
      position: relative;
    }

    .cat {
      font-size: 75px;
      animation: bounce 1.5s infinite;
    }

    h1 {
      font-size: clamp(27px, 6vw, 38px);
      margin: 12px 0;
      color: #e04c91;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 100px;
      margin-top: 15px;
      position: relative;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px #d96b9c55;
      transition: transform .2s;
    }

    button:hover {
      transform: scale(1.08);
    }

    #yes {
      background: #ff65a3;
      color: white;
    }

    #no {
      background: #f2e7ee;
      color: #a94c78;
      position: relative;
      z-index: 5;
    }

    #result {
      display: none;
      margin-top: 22px;
      animation: appear .6s ease;
    }

    #result h2 {
      color: #f02f89;
      font-size: clamp(27px, 7vw, 40px);
      animation: pulse 1s infinite;
    }

    .gifs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .gifs img {
      width: min(42%, 175px);
      height: 165px;
      object-fit: cover;
      border-radius: 18px;
      background: #ffe5f0;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      font-size: 25px;
      pointer-events: none;
      animation: floatUp 3s linear forwards;
      z-index: 10;
    }

    .small {
      color: #d782a7;
      font-size: 13px;
      margin-top: 25px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes pulse {
      50% { transform: scale(1.07); }
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
      }
    }

    @media (max-width: 400px) {
      .card { padding: 25px 14px; }
      button { padding: 12px 24px; }
      .buttons { gap: 12px; }
      .gifs img { height: 130px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="cat">🥺🐱</div>

    <h1>Perdóname, miamorrrr 💗</h1>

    <p class="subtitle">
      Sé que la cagué, mi amorcito... 😭<br>
      Pero te amo muchísimo.<br>
      ¿Me perdonas, mi vida? 🥹💕
    </p>

    <div class="buttons">
      <button id="yes">SÍ 💗</button>
      <button id="no">NO 😾</button>
    </div>

    <p id="hint" class="small">
      Pista: el NO es un poquito tímido... 👀
    </p>

    <section id="result" aria-live="polite">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="gifs" id="gifs"></div>
    </section>

    <p class="small">Hecho con amor y muchos michis 🐾</p>
  </main>

  <script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const gifs = document.getElementById("gifs");
    const hint = document.getElementById("hint");

    let attempts = 0;

    const cryingCats = [
      "https://media.tenor.com/5Llgt0bTwhAAAAAM/crying-cat.gif",
      "https://media.tenor.com/2roX3uxz_68AAAAM/cat-crying.gif"
    ];

    const loveCats = [
      "https://media.tenor.com/8X2vJ9o3JbAAAAAM/cat-love.gif",
      "https://media.tenor.com/5T8m0Z7Jr0AAAAAM/cat-hearts.gif"
    ];

    function showCats(images, alt) {
      gifs.replaceChildren();

      images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        img.loading = "eager";

        img.onerror = () => {
          img.replaceWith(
            Object.assign(document.createElement("span"), {
              textContent: alt
            })
          );
        };

        gifs.appendChild(img);
      });
    }

    function heartsRain() {
      const emojis = ["💗", "💖", "💕", "💘", "🐱", "💞"];

      for (let i = 0; i < 28; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];

          heart.style.left = Math.random() * 100 + "vw";
          heart.style.animationDuration =
            (2 + Math.random() * 2) + "s";

          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 4200);
        }, i * 90);
      }
    }

    function showCrying() {
      result.style.display = "block";
      resultTitle.textContent = "¿¿¿NOOOO??? 😭💔";
      resultText.textContent =
        "MIRA CÓMO LLORAN LOS GATITOS, MIAMORRRR 😿";
      showCats(cryingCats, "Gatito llorando 😿");
    }

    function moveNo() {
      if (resultTitle.textContent.startsWith("TE AMO")) return;

      attempts++;
      showCrying();

      // El NO escapa por toda la pantalla.
      no.style.position = "fixed";

      const margin = 15;
      const maxX = Math.max(
        margin,
        window.innerWidth - no.offsetWidth - margin
      );
      const maxY = Math.max(
        margin,
        window.innerHeight - no.offsetHeight - margin
      );

      no.style.left =
        (margin + Math.random() * (maxX - margin)) + "px";
      no.style.top =
        (margin + Math.random() * (maxY - margin)) + "px";

      hint.textContent = attempts > 3
        ? "JAJAJA NO ME ATRAPAS, MIAMOR 😹💨"
        : "¡AY NO! ¡EL BOTÓN ESTÁ ESCAPANDO! 🏃💨";
    }

    no.addEventListener("pointerenter", moveNo);
    no.addEventListener("click", moveNo);
    no.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNo();
    }, { passive: false });

    yes.addEventListener("click", () => {
      result.style.display = "block";
      resultTitle.textContent = "TE AMO AMIAMORRRR 💗💋";
      resultText.textContent =
        "GRACIAS POR PERDONARME, MI VIDA 🥹💕 " +
        "ERES MI PERSONITA FAVORITA. MUA MUA MUA 💋";

      showCats(loveCats, "Gatitos enamorados 💗");
      heartsRain();

      no.style.display = "none";
      yes.textContent = "TE AMO 💖";
      hint.textContent = "AHORA UN ABRAZOTE, POR FAVOR 🫂💕";

      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });
  </script>
</body>
</html>
