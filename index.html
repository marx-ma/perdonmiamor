
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe4ef">

  <title>Perdóname, miamorrrr 💗</title>

  <!-- Fuentes románticas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff3f7, #f7e0e9, #fff5fa);
      color: #d3a6bc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    body::before {
      content: "♡  ✧  ♡  ✧  ♡";
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 24px;
      color: #e4dee0;
      letter-spacing: 12px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 540px;
      padding: 32px 22px;
      background: rgba(255, 255, 255, .94);
      border: 2px solid white;
      border-radius: 32px;
      text-align: center;
      box-shadow: 0 15px 45px #d96b9c40;
      position: relative;
      z-index: 1;
    }

    .cat {
      font-size: 76px;
      animation: bounce 1.5s infinite;
    }

    h1, #result h2, #success h2 {
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

    h1 {
      color: #e6e6e6;
      font-size: clamp(42px, 9vw, 58px);
      margin: 12px 0;

    }

    .subtitle {
      font-size: 16px;
      line-height: 1.9;
      color: #dabac9;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      min-height: 85px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 40px;
      padding: 14px 30px;
      font-family: 'Quicksand', sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px #d96b9c35;
      -webkit-tap-highlight-color: transparent;
    }

    #yes {
      color: white;
      background: linear-gradient(135deg, #ff8fba, #f0448d);
      position: relative;
      z-index: 2;
      transition: transform .2s;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #fff;
      color: #c04e83;
      border: 2px solid #ffd1e3;
      position: fixed;
      z-index: 9999;
      left: 55%;
      top: 60%;
      transition: left .12s ease, top .12s ease;
      touch-action: manipulation;
    }

    #result {
      display: none;
      margin-top: 24px;
      animation: appear .5s ease;
    }

    #result h2 {
      color: #f8c5dd;
      font-size: 42px;
      margin-bottom: 8px;
    }

    #resultText {
      line-height: 1.7;
    }

    .gifs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .gifs img {
      width: min(43%, 190px);
      height: 165px;
      object-fit: contain;
      background: #fff2f8;
      border: 2px solid #ffe0ec;
      border-radius: 20px;
    }

    .gif-fallback {
      width: min(43%, 190px);
      min-height: 140px;
      display: grid;
      place-items: center;
      background: #fff2f8;
      border-radius: 20px;
      font-size: 48px;
    }

    .small {
      color: #d782a7;
      font-size: 13px;
      margin-top: 24px;
    }

    .floating {
      position: fixed;
      bottom: -50px;
      pointer-events: none;
      z-index: 10001;
      animation: floatUp 3.5s linear forwards;
    }

    #success {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ffe4ef, #ffc4dc, #fff6fa);
      z-index: 1000;
      overflow-y: auto;
      padding: 25px 15px;
      text-align: center;
      align-items: center;
      justify-content: center;
    }

    #success .success-card {
      width: 100%;
      max-width: 560px;
      margin: auto;
      padding: 28px 20px;
      background: rgba(255, 255, 255, .96);
      border: 3px solid white;
      border-radius: 32px;
      box-shadow: 0 12px 40px #d96b9c45;
      animation: appear .5s ease;
    }

    #success h2 {
      color: #dfc1cf;
      font-size: clamp(40px, 9vw, 60px);
      margin: 14px 0;
      animation: pulse 1s infinite;
    }

    #success p {
      line-height: 1.9;
      font-size: 16px;
    }

    .final-kitties {
      font-size: 65px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes pulse {
      50% { transform: scale(1.05); }
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.85); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-120vh) rotate(35deg);
        opacity: 0;
      }
    }

    @media (max-width: 400px) {
      .card { padding: 25px 14px; }
      button { padding: 12px 24px; }
      .gifs img { height: 135px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat, #result h2, #success h2 {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="card" id="mainCard">
    <div class="cat">🥺🐱</div>

    <h1>Perdóname 💗</h1>

    <p class="subtitle">
      no vuelve a pasar, eh <br>
      ¿Me perdonas, pulgita? 🥺💕
    </p>

    <div class="buttons">
      <button id="yes">SÍ 💗</button>
    </div>

    <p class="small" id="hint"></p>

    <section id="result" aria-live="polite">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="gifs" id="gifs"></div>
    </section>
  </main>

  <!-- Pantalla final -->
  <section id="success">
    <div class="success-card">
      <div class="final-kitties">🐱💗🐱</div>

      <h2>TE AMO MIAMORRRR</h2>

      <p>
        GRACIAS POR PERDONARME CUCARACHINA<br>
        MUA MUA MUA MUA 💋💋💋
      </p>

      <div class="gifs" id="loveGifs"></div>

      <p>YOSABIAQSI JAJAJA 💗</p>
    </div>
  </section>

  <button id="no">NO 🙄</button>

  <script>
    // IMPORTANTE: estos nombres deben coincidir con
    // los archivos que subiste a la carpeta gifs de GitHub.

  
const cryingCats = [
  "./gatitol1.gif",
  "./gatitol2.jpg"
];

const loveCats = [
  "./gatitosa.gif"
];


    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const gifs = document.getElementById("gifs");
    const loveGifs = document.getElementById("loveGifs");
    const hint = document.getElementById("hint");
    const success = document.getElementById("success");

    let attempts = 0;
    let cryingInterval = null;
    let hasWon = false;

    // Muestra las imágenes y avisa en consola si falla alguna.
    function showCats(container, images, alt) {
      container.replaceChildren();

      images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;

        img.onerror = () => {
          console.error("No se pudo cargar la imagen:", src);

          const fallback = document.createElement("div");
          fallback.className = "gif-fallback";
          fallback.textContent = alt.includes("llorando")
            ? "😿💧"
            : "😻💖";

          fallback.title = "Revisa la ruta: " + src;
          img.replaceWith(fallback);
        };

        container.appendChild(img);
      });
    }

    // Lluvia de corazones y gatitos.
    function heartsRain() {
      const emojis = ["💗", "💖", "💕", "💘", "🐱", "💞", "💋"];

      for (let i = 0; i < 65; i++) {
        setTimeout(() => {
          if (!hasWon) return;

          const heart = document.createElement("div");
          heart.className = "floating";
          heart.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];

          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize =
            (20 + Math.random() * 25) + "px";

          heart.style.animationDuration =
            (2.5 + Math.random() * 2) + "s";

          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 5000);
        }, i * 100);
      }
    }

    // El botón NO escapa por la pantalla.
    function moveNo() {
      if (hasWon) return;

      attempts++;

      result.style.display = "block";
      resultTitle.textContent = "¿¿¿NOOOO??? 😭";
      resultText.textContent =
        "VOY A LLORAR SI NO ME PERDONAS MIAMORRRR 💔";

      showCats(gifs, cryingCats, "Gatito llorando");

      if (!cryingInterval) {
        cryingInterval = setInterval(() => {
          if (hasWon) return;
          showCats(gifs, cryingCats, "Gatito llorando");
        }, 2500);
      }

      const maxX = Math.max(0, window.innerWidth - no.offsetWidth);
      const maxY = Math.max(0, window.innerHeight - no.offsetHeight);

      let x, y;
      const currentX = no.getBoundingClientRect().left;
      const currentY = no.getBoundingClientRect().top;

      let tries = 0;

      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
        tries++;
      } while (
        tries < 30 &&
        Math.abs(x - currentX) < 130 &&
        Math.abs(y - currentY) < 100
      );

      no.style.left = x + "px";
      no.style.top = y + "px";

      hint.textContent = attempts > 5
        ? "YA PERDÓNAMEEEE 😭💗"
        : "AMORMÍO PELDONNN 🥺";
    }

    no.addEventListener("pointerenter", moveNo);

    no.addEventListener("pointerdown", event => {
      event.preventDefault();
      moveNo();
    });

    no.addEventListener("click", event => {
      event.preventDefault();
      moveNo();
    });

    window.addEventListener("resize", () => {
      if (hasWon) return;

      const maxX = Math.max(0, window.innerWidth - no.offsetWidth);
      const maxY = Math.max(0, window.innerHeight - no.offsetHeight);

      no.style.left =
        Math.min(parseFloat(no.style.left) || 0, maxX) + "px";

      no.style.top =
        Math.min(parseFloat(no.style.top) || 0, maxY) + "px";
    });

    // Final feliz al pulsar SÍ.
    yes.addEventListener("click", () => {
      if (hasWon) return;

      hasWon = true;

      if (cryingInterval) {
        clearInterval(cryingInterval);
        cryingInterval = null;
      }

      no.style.display = "none";
      success.style.display = "flex";

      showCats(loveGifs, loveCats, "Gatitos enamorados");
      heartsRain();
    });
  </script>

</body>
</html>
